name: Build & Release APK

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check-release.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if latest commit is already tagged and released
        id: check-release
        run: |
          commit=$(git rev-parse HEAD)
          tag=$(git tag --points-at "$commit" | head -n 1)

          if [ -n "$tag" ]; then
            echo "Latest commit already has tag: $tag"
            # Check if release exists
            release=$(gh release view "$tag" --json tagName --jq .tagName || true)
            if [ "$release" == "$tag" ]; then
              echo "Release already exists for tag $tag. Skipping..."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "No release found for latest commit, proceeding..."
          echo "should_run=true" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.check.outputs.should_run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./release-apk

      - name: Determine next version
        id: version
        run: |
          latest_tag=$(git tag --list "v*" --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            next_version="0.0.1"
          else
            latest=${latest_tag#v}
            IFS='.' read -r major minor patch <<< "$latest"
            patch=$((patch + 1))
            next_version="$major.$minor.$patch"
          fi
          echo "Next version: $next_version"
          echo "version=$next_version" >> $GITHUB_OUTPUT

      - name: Create Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: ./release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
